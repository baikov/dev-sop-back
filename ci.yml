name: ci

volumes:
  ci_postgres_data: {}
  ci_postgres_data_backups: {}

services:
  django: &django
    image: ci_local_django
    container_name: ci_local_django
    env_file: !reset []
    depends_on: !override
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_ADMIN_URL=admin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ci
      - POSTGRES_USER=ci_user
      - POSTGRES_PASSWORD=12345678
      - DJANGO_DOCKER_PORT=8000

  postgres:
    image: ci_postgres
    container_name: ci_postgres
    env_file: !reset []
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ci
      - POSTGRES_USER=ci_user
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DOCKER_PORT=5432
    volumes:
      - ci_postgres_data:/var/lib/postgresql/data
      - ci_postgres_data_backups:/backups:z

  mailpit: !reset null
  redis: !reset null
  celeryworker: !reset null
  celerybeat: !reset null
  flower: !reset null
